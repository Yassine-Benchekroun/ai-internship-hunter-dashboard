function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function initials(n){return String(n).split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase()}function opp(id){return state.opportunities.find(o=>o.id===id)}function linkedApps(id){return state.applications.filter(a=>a.opportunityId===id)}function fmtDate(date){if(!date||date==='Not listed')return date||'—';const d=new Date(date+'T00:00:00');return Number.isNaN(d.getTime())?date:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function visibleOpps(s){return state.opportunities.filter(o=>o.activeSections?.includes(s)&&matchesFilters(o))}function matchesFilters(o){const f=state.filters||{};if(state.search&&!([o.org,o.contact,o.position,o.country,o.type,o.lab].join(' ').toLowerCase().includes(state.search.toLowerCase())))return false;if(f.country&&f.country!=='All'&&o.country!==f.country)return false;if(f.type&&f.type!=='All'&&o.type!==f.type)return false;if(f.status&&f.status!=='All'&&o.status!==f.status)return false;return true}function sortedOpps(items){const s=state.filters?.sort||'score';return[...items].sort((a,b)=>s==='score'?b.score-a.score:s==='org'?a.org.localeCompare(b.org):s==='country'?a.country.localeCompare(b.country):s==='date'?b.discovered.localeCompare(a.discovered):a.status.localeCompare(b.status))}function count(s){if(s==='new')return visibleOpps('new').length;if(s==='top')return visibleOpps('top').length;if(s==='lower')return visibleOpps('lower').length;if(s==='history')return state.opportunities.length;if(s==='applications')return state.applications.length;if(s==='ready')return state.opportunities.filter(o=>o.status==='Ready').length;return 0}function stats(){return{new:count('new'),top:count('top'),lower:count('lower'),sent:state.applications.length,replies:state.applications.filter(a=>['Replied','Interview','Offer'].includes(a.status)).length,interviews:state.applications.filt function toolbarHTML(){return`<div class="toolbar-left"><select class="select" aria-label="Sort opportunities" onchange="setFilter('sort',this.value)"><option value="score" ${state.filters.sort==='score'?'selected':''}>Sort: Match score</option><option value="country" ${state.filters.sort==='country'?'selected':''}>Sort: Country</option><option value="date" ${state.filters.sort==='date'?'selected':''}>Sort: Date found</option><option value="org" ${state.filters.sort==='org'?'selected':''}>Sort: Organization</option><option value="status" ${state.filters.sort==='status'?'selected':''}>Sort: Status</option></select><select class="select" aria-label="Filter country" onchange="setFilter('country',this.value)"><option>All countries</option>${['United States','France','Germany','Spain','United Arab Emirates','Saudi Arabia','China','Japan','Netherlands'].map(c=>`<option ${state.filters.country===c?'selected':''}>${c}</option>`).join('')}</select><select class="select" aria-label="Filter status" onchange="setFilter('status',this.value)"><option>All statuses</option>${['Ready','Review','Needs review','Already Sent','Waiting','Replied','Interview'].map(c=>`<option ${state.filters.status===c?'selected':''}>${c}</option>`).join('')}</select></div>`}function filterChip(label,active){return`<button class="filter-chip ${active?'active':''}" onclick="applyQuickFilter('${esc(label)}')">${esc(label)}</button>`}
function opportunityRouteHTML(section){const labels={new:['Processing queue','New / Unreviewed','Every new record is first saved to permanent history, then manually classified.'],top:['Ranked opportunities','Top Matches','Transparent scores of 70+ — strong alignment, not an automatic decision.'],lower:['Keep in view','Lower Matches','Scores below the threshold remain valid, visible, and available for manual strategy changes.']}[section];const items=sortedOpps(visibleOpps(section));return`${pageIntro(labels[0],labels[1],labels[2],section==='new'?`<button class="btn primary" onclick="openManualApplication()">${icon('plus')} Add sent application</button>`:`<button class="btn ghost" onclick="navigate('history')">${icon('archive')} Open history</button>`)}${section==='new'?'<div class="notice" style="margin-bottom:15px"><strong>Queue behavior:</strong> classification moves records to Top or Lower Matches, but never deletes them. A manual application already sent is labeled clearly and never triggers another send.</div>':''}<div class="filter-strip">${filterChip('All',state.filters.type==='All'&&state.filters.country==='All'&&state.filters.status==='All')}${filterChip('Company',state.filters.type==='Company')}${filterChip('University / research',state.filters.type==='University / research')}${filterChip('France',state.filters.country==='France')}${filterChip('Germany',state.filters.country==='Germany')}${filterChip('Remote',false)}${filterChip('Paid',false)}</div><div class="panel table-panel"><div class="table-toolbar">${toolbarHTML()}<div class="toolbar-right"><span class="muted" style="font-size:10px">${items.length} visible record${items.length===1?'':'s'}</span></div></div><div class="cards-grid" style="padding:16px">${items.map(o=>cardHTML(o,section)).join('')||emptyState('No opportunities match these filters','Try clearing the filters or adding a manual application.')}</div><div class="table-wrap">${opportunityTableHTML(items,section)}</div></div>${state.selected.length?selectionFooter():''}`}function cardHTML(o,section){return`<article class="opp-card ${section==='top'?'top-card':section==='lower'?'lower-card':'new-card'}"><div class="opp-card-head"><div class="opp-identity"><div class="org-avatar ${o.kind==='university'?'uni':''} ${o.demo?'demo':''}">${initials(o.org)}</div><div style="min-width:0"><div class="org-name">${esc(o.org)} ${o.demo?'<span class="demo-label">Demo</span>':''}</div><div class="org-position">${esc(o.position)}</div></div></div><div class="score-ring"><div class="score-number ${o.score>=state.threshold?'high':'low'}">${o.score}</div><div class="score-label">/ 100 score</div></div></div><div class="pill-row"><span class="pill ${o.kind==='university'?'yellow':'cyan'}">${esc(o.type)}</span>${statusPill(o.status)}${o.label?`<span class="pill cyan">${esc(o.label)}</span>`:''}</div><p class="opp-summary">${esc(o.summary)}</p><div class="pill-row">${(o.verifiedSkills||[]).slice(0,3).map(x=>`<span class="pill green">✓ ${esc(x)}</span>`).join('')}${(o.missingSkills||[]).length?`<span class="pill red">✗ ${esc(o.missingSkills[0])}</span>`:''}</div><div class="opp-meta"><div><div class="meta-label">Location</div><div class="meta-value">${esc(o.city?`${o.city}, ${o.country}`:o.country)}</div></div><div><div class="meta-label">Deadline</div><div class="meta-value">${esc(fmtDate(o.deadline))}</div></div><div><div class="meta-label">Discovered</div><div class="meta-value">${esc(fmtDate(o.discovered))}</div></div></div><div class="card-actions"><button class="btn small ghost" onclick="openDetails('${o.id}')">${icon('info')} Details</button><button class="btn small ghost" onclick="openCV('${o.id}')">${icon('file')} CV</button><button class="btn small ghost" onclick="openEmail('${o.id}')">${icon('mail')} Email</button><button class="btn small" onclick="openImprove('${o.id}')">${icon('wand')} Improve</button>${section==='new'?`<button class="btn small" onclick="classifyOpportunity('${o.id}','top')">Classify top</button><button class="btn small" onclick="classifyOpportunity('${o.id}','lower')">Classify lower</button>`:''}<button class="btn small danger" onclick="confirmRemoveActive('${o.id}','${section}')">${icon('trash')} Remove</button></div></article>`}
function opportunityTableHTML(items,section){return`<div class="table-toolbar" style="border-top:1px solid var(--line);border-bottom:0"><div><h3>Operational table</h3><div class="panel-kicker">Each row preserves the link back to the opportunity record.</div></div></div><table><thead><tr><th><input type="checkbox" aria-label="Select all" onchange="toggleAllSelected(this.checked,'${section}')"></th><th>Organization</th><th>Professor / contact</th><th>Position / research area</th><th>Country</th><th>Score</th><th>Deadline</th><th>CV</th><th>Email</th><th>Status</th><th>Found</th><th>Manage</th></tr></thead><tbody>${items.map(o=>`<tr><td><input type="checkbox" ${state.selected.includes(o.id)?'checked':''} onchange="toggleSelected('${o.id}',this.checked)" aria-label="Select ${esc(o.org)}"></td><td><div class="table-org">${esc(o.org)}</div><div class="table-secondary">${esc(o.kind==='university'?'University / research':'Company')}</div></td><td>${esc(o.contact)}</td><td><div class="table-org" style="font-size:10px;max-width:210px">${esc(o.position)}</div><div class="table-secondary">${esc(o.lab||'—')}</div></td><td>${esc(o.country)}</td><td><span class="pill ${o.score>=state.threshold?'cyan':'yellow'}">${o.score}/100</span></td><td>${esc(fmtDate(o.deadline))}</td><td><button class="table-link" onclick="openCV('${o.id}')">${esc(o.cvVersion||'CV v1')}</button></td><td><button class="table-link" onclick="openEmail('${o.id}')">${esc(o.emailVersion||'Draft')}</button></td><td>${statusPill(o.status)}</td><td>${esc(fmtDate(o.discovered))}</td><td><button class="btn small danger" onclick="confirmRemoveActive('${o.id}','${section}')">Remove</button></td></tr>`).join('')||'<tr><td colspan="12"><div class="empty-state">No records in this view.</div></td></tr>'}</tbody></table>`}function selectionFooter(){return`<div class="selection-footer"><span>${state.selected.length} opportunity${state.selected.length===1?'':'ies'} selected for review</span><div class="button-row"><button class="btn small ghost" onclick="state.selected=[];persist();render()">Clear</button><button class="btn small primary" onclick="openBatchReview()">Review selected applications ${icon('chevron')}</button></div></div>`}
function applicationsWorkbenchHTML(){const ready=state.opportunities.filter(o=>o.status==='Ready');return`${pageIntro('Application workbench','Turn a strong match into a deliberate draft.','Each selected opportunity gets its own recipient, subject, email version, and targeted CV. Nothing is sent from this dashboard.',`<button class="btn primary" onclick="openManualApplication()">${icon('plus')} Add application manually</button>`)}<div class="dashboard-grid"><div class="panel pad"><div class="panel-head"><div><h2>Ready to review</h2><div class="panel-kicker">Select from the table to build a batch review</div></div><span class="pill cyan">${ready.length} ready</span></div>${ready.length?`<div class="list-stack">${ready.map(historyMini).join('')}</div>`:emptyState('No opportunities are marked Ready','Classify and improve a match before adding it to a review batch.')}</div><div class="panel pad"><div class="guardrail"><h3>${icon('send')} Explicit action only</h3><p>Email integration is currently ${state.connected?'connected':'not connected'}. Even after connection, drafts require your explicit review and confirmation before sending.</p><div class="button-row" style="margin-top:13px"><button class="btn small ${state.connected?'primary':'ghost'}" onclick="toggleConnection()">${state.connected?'Manage connection':'Connect email'}</button><button class="btn small ghost" onclick="navigate('application-history')">View sent history</button></div></div><div class="section-space"><div class="notice">Low match scores are not automatically rejected. Use <strong>Improve Application</strong> to change emphasis using verified information only, then keep every version.</div></div></div></div><div class="section-space panel table-panel"><div class="table-toolbar"><div><h3>Application selection queue</h3><div class="panel-kicker">One personalized draft per selected opportunity</div></div><button class="btn small primary" onclick="openBatchReview()">Review selected</button></div><div class="table-wrap">${opportunityTableHTML(sortedOpps(state.opportunities),'applications')}</div></div>${state.selected.length?selectionFooter():''}`}
function historyHTML(){const items=sortedOpps(state.opportunities.filter(o=>matchesFilters(o)));return`${pageIntro('Permanent record','Opportunity History','Everything discovered is stored here before classification. Removing an active card never removes this record.',`<button class="btn ghost" onclick="confirmClearHistory()">${icon('trash')} Clear history</button>`)}<div class="source-banner"><div><h3>${items.length} history record${items.length===1?'':'s'}</h3><div class="panel-kicker">Application records remain independent if an opportunity is deleted.</div></div><div class="button-row"><span class="pill cyan">Never silently deleted</span><button class="btn small primary" onclick="openManualApplication()">${icon('plus')} Add sent application</button></div></div><div class="panel table-panel"><div class="table-toolbar">${toolbarHTML()}<span class="muted" style="font-size:10px">Select a record to inspect its full source, score, and linked applications.</span></div><div class="table-wrap"><table><thead><tr><th>Organization</th><th>Contact</th><th>Position / research area</th><th>First discovered</th><th>Last checked</th><th>Score</th><th>Application</th><th>Status</th><th>Actions</th></tr></thead><tbody>${items.map(o=>`<tr><td><div class="table-org">${esc(o.org)}</div><div class="table-secondary">${o.demo?'<span class="demo-label">Demo data</span>':''} ${o.origin==='manual'?'<span class="manual-label">Manual entry</span>':''}</div></td><td>${esc(o.contact)}</td><td><div class="table-org" style="max-width:260px;font-size:10px">${esc(o.position)}</div><div class="table-secondary">${esc(o.source)}</div></td><td>${esc(fmtDate(o.discovered))}</td><td>${esc(fmtDate(o.lastChecked))}</td><td><span class="pill ${o.score>=state.threshold?'cyan':'yellow'}">${o.score}/100</span></td><td>${o.sent?'<span class="pill green">Sent</span>':'<span class="pill">Not sent</span>'}</td><td>${statusPill(o.status)}</td><td><div class="button-row"><button class="btn small ghost" onclick="openDetails('${o.id}')">View</button><button class="btn small danger" onclick="confirmDeleteHistory('${o.id}')">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="9"><div class="empty-state">Opportunity History is empty. Applications, if any, remain in their own history.</div></td></tr>'}</tbody></table></div></div>`}
function applicationHistoryHTML(){const apps=[...state.applications].sort((a,b)=>b.sentDate.localeCompare(a.sentDate));return`${pageIntro('Independent record','Application / Sent History','Applications can be added, edited, and deleted independently from Opportunity History.',`<button class="btn primary" onclick="openManualApplication()">${icon('plus')} Add application manually</button>`)}<div class="source-banner"><div><h3>${apps.length} application${apps.length===1?'':'s'}</h3><div class="panel-kicker">Deleting one never deletes its linked opportunity.</div></div><span class="pill ${state.connected?'green':''}">${state.connected?'Email connected':'Draft-only mode'}</span></div><div class="list-stack">${apps.map(applicationRow).join('')||emptyState('No applications yet','Use Add application manually to create a sent-history record.')}</div>`}function applicationRow(a){const linked=opp(a.opportunityId);return`<div class="history-row"><div class="history-main"><div class="org-avatar ${linked?.kind==='university'?'uni':''} ${a.demo?'demo':''}">${initials(a.org)}</div><div class="history-copy"><div class="history-title">${esc(a.org)} <span class="muted">·</span> ${esc(a.position)}</div><div class="history-detail">Sent ${esc(fmtDate(a.sentDate))} · ${esc(a.recipient)} · ${linked?`linked to ${esc(linked.id)}`:'<span class="yellow">opportunity history record removed</span>'}</div><div class="pill-row"><span class="pill ${['Sent','Waiting','Replied','Interview','Offer','Already Sent'].includes(a.status)?'green':'yellow'}">${esc(a.status)}</span><span class="pill">${esc(a.cvVersion||'CV v1')}</span><span class="pill">${esc(a.emailVersion||'Email v1')}</span>${a.demo?'<span class="demo-label">Demo data</span>':''}</div></div></div><div class="history-actions"><button class="btn small ghost" onclick="openEmailForApp('${a.id}')">${icon('mail')} Email</button><button class="btn small ghost" onclick="openEditApplication('${a.id}')">${icon('edit')} Edit</button><button class="btn small danger" onclick="confirmDeleteApplication('${a.id}')">${icon('trash')} Delete</button></div></div>`}
function profileHTML(){return`${pageIntro('Source of truth','Verified Profile Registry','This is the exact information the application generator is allowed to use. Every item keeps an evidence source and a verification state.',`<a class="btn ghost" href="https://github.com/Yassine-Benchekroun" target="_blank" rel="noopener">${icon('external')} Open GitHub</a>`)}<div class="source-banner"><div><h3>Approved sources</h3><div class="panel-kicker">Only these sources may add profile facts.</div></div><div class="source-links"><a class="source-link" href="https://github.com/Yassine-Benchekroun" target="_blank" rel="noopener">GitHub</a><a class="source-link" href="https://yassine-benchekroun.github.io" target="_blank" rel="noopener">Portfolio</a></div></div><div class="notice" style="margin-bottom:15px"><strong>Demo registry snapshot:</strong> the seeded facts mirror examples from the product brief and are visibly flagged for verification before operational use. Missing or unverified skills are never added to CVs.</div><div class="profile-grid">${profileCard('Skills',profileRegistry.skills)}${profileCard('Projects',profileRegistry.projects)}${profileCard('Experience & education',profileRegistry.experience)}${profileCard('Allowed transformations',[['Reorder verified skills','Presentation only','No new facts added','verified'],['Rewrite verified summary','Factually grounded','No invented claims','verified'],['Add AWS / Kubernetes','Not allowed without evidence','Data safety rule','pending'],['Change dates or metrics','Not allowed','Data safety rule','pending']])}</div>`}function profileCard(t,items){return`<div class="profile-card"><h3>${esc(t)} <span class="pill cyan">${items.filter(x=>x[3]==='verified').length} verified</span></h3><div class="profile-items">${items.map(x=>`<div class="profile-item"><div><div class="profile-item-name">${esc(x[0])}</div><div class="profile-item-source">${esc(x[2])}</div></div><div class="profile-status ${x[3]==='pending'?'pending':''}">${x[3]==='verified'?'Verified ✓':'Not verified ✗'}</div></div>`).join('')}</div></div>`}
function settingsHTML(){return''}
function render(){persist();layout()}function navigate(r){state.route=r;state.selected=[];render();if(innerWidth<900)document.getElementById('sidebar')?.classList.remove('open')}function toggleSidebar(){document.getElementById('sidebar')?.classList.toggle('open')}function setSearch(v){state.search=v;persist();const c=document.getElementById('content');if(c)c.innerHTML=routeHTML()}function setFilter(k,v){if(k==='country'&&v==='All countries')v='All';if(k==='status'&&v==='All statuses')v='All';state.filters[k]=v;render()}function applyQuickFilter(l){state.filters.type='All';state.filters.country='All';state.filters.status='All';if(l==='Company')state.filters.type='Company';if(l==='University / research')state.filters.type='Research internship';if(['France','Germany'].includes(l))state.filters.country=l;render()}function setThreshold(v){state.threshold=Number(v);persist();document.querySelector('.range-value')?.replaceChildren(document.createTextNode(v));document.getElementById('content').innerHTML=routeHTML()}function toggleConnection(){state.connected=!state.connected;persist();render();toast(state.connected?'Demo email connection enabled. Sending remains explicit.':'Email disconnected. Drafts remain available.')}function toast(m,w=false){const r=document.getElementById('toast-root'),e=document.createElement('div');e.className='toast'+(w?' warn':'');e.textContent=m;r.appendChild(e);setTimeout(()=>e.remove(),3600)}function closeModal(){document.getElementById('modal-root').innerHTML=''}function modal(t,s,b,f='',wide=false){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal ${wide?'wide':''}"><div class="modal-head"><div><div class="modal-title">${t}</div>${s?`<div class="modal-subtitle">${s}</div>`:''}</div><button class="close-btn" onclick="closeModal()" aria-label="Close">${icon('x')}</button></div><div class="modal-body">${b}</div>${f?`<div class="modal-foot">${f}</div>`:''}</div></div>`}function confirmModal(t,txt,label,fn,danger=true){window.__confirmAction=fn;modal(esc(t),esc('This action is explicit and can affect stored records.'),`<div class="notice" style="border-left-color:${danger?'var(--red)':'var(--green)'}">${esc(txt)}</div>`,`<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn ${danger?'danger':'primary'}" onclick="window.__confirmAction();closeModal()">${esc(label)}</button>`)}
function confirmRemoveActive(id,s){const o=opp(id),label=s==='new'?'New / Unreviewed':s==='top'?'Top Matches':'Lower Matches';confirmModal('Remove from active section?',`Remove “${o?.org} · ${o?.position}” from ${label}? The record will remain in Opportunity History and any linked application history will remain untouched.`,'Remove from section',()=>{const x=opp(id);if(x)x.activeSections=(x.activeSections||[]).filter(v=>v!==s);persist();render();toast('Removed from the active section. Opportunity History preserved.')})}function confirmDeleteHistory(id){const o=opp(id);confirmModal('Permanently delete opportunity history?',`Are you sure you want to permanently delete “${o?.org} · ${o?.position}” from Opportunity History? This action cannot be undone. Linked Application / Sent History will remain.`,'Delete history record',()=>{window.queueCloudOpportunityDeletion?.(id);state.opportunities=state.opportunities.filter(x=>x.id!==id);persist();render();toast('Opportunity history record deleted. Application history was preserved.')})}function confirmClearHistory(){confirmModal('Clear Opportunity History?','Are you sure you want to permanently delete all opportunity history? This action cannot be undone. Application / Sent History will not be deleted.','Clear Opportunity History',()=>{window.queueCloudOpportunityDeletion?.(state.opportunities.filter(x=>!x.demo).map(x=>x.id));state.opportunities=[];persist();render();toast('Opportunity History cleared. Application History remains intact.')})}function confirmDeleteApplication(id){const a=state.applications.find(x=>x.id===id);confirmModal('Delete application record?',`Delete the Application / Sent History record for “${a?.org}”? The linked Opportunity History record will remain unchanged.`,'Delete application',()=>{window.queueCloudApplicationDeletion?.(id);state.applications=state.applications.filter(x=>x.id!==id);persist();render();toast('Application record deleted. Opportunity History preserved.')})}
function scoreBreakdown(o){return Object.entries({'Technical skills':[o.breakdown.technical,30],'Project similarity':[o.breakdown.projects,25],'Topic alignment':[o.breakdown.topic,20],'Education / profile':[o.breakdown.education,10],'Eligibility':[o.breakdown.eligibility,10],'Accessibility':[o.breakdown.access,5]}).map(([l,[v,m]])=>`<div><div class="break-row"><span>${l}</span><strong>${v}/${m}</strong></div><div class="bar"><span style="width:${v/m*100}%"></span></div></div>`).join('')}
function openDetails(id){const o=opp(id);if(!o)return;const apps=linkedApps(id);modal(`${esc(o.org)} <span class="muted">·</span> ${esc(o.position)}`,`${o.demo?'DEMO DATA · ':''}${o.kind==='university'?'University / research':'Company'} · ${esc(o.country)} · record ${esc(o.id)}`,`<div class="detail-grid"><div class="detail-block"><div class="detail-label">Organization</div><div class="detail-value">${esc(o.org)}<br/><span class="muted">${esc(o.lab||o.city||'Location not listed')}</span></div></div><div class="detail-block"><div class="detail-label">Contact</div><div class="detail-value">${esc(o.contact)}<br/><span class="muted">${o.source?'Official source available':'No source URL saved'}</span></div></div><div class="detail-block full"><div class="detail-label">Description</div><div class="detail-value">${esc(o.description)}</div></div><div class="detail-block"><div class="detail-label">Verified match</div><div class="pill-row">${(o.verifiedSkills||[]).map(x=>`<span class="pill green">✓ ${esc(x)}</span>`).join('')}${(o.missingSkills||[]).map(x=>`<span class="pill red">✗ ${esc(x)}</span>`).join('')}</div><div class="detail-label" style="margin-top:15px">Relevant verified projects</div><div class="detail-value">${(o.projects||[]).map(esc).join(' · ')||'—'}</div></div><div class="detail-block"><div class="detail-label">Match breakdown · ${o.score}/100</div><div class="breakdown">${scoreBreakdown(o)}</div></div><div class="detail-block full"><div class="detail-label">Why this matches me</div><div class="detail-value">${esc(o.summary)}<br/><br/><span class="muted">Possible weaknesses:</span> ${o.missingSkills?.length?esc(o.missingSkills.join(', '))+' are not verified in the approved profile registry.':'No missing requirements recorded.'}</div></div><div class="detail-block"><div class="detail-label">Requirements</div><div class="detail-value">${(o.requirements||[]).map(x=>`• ${esc(x)}`).join('<br/>')||'Not listed'}</div></div><div class="detail-block"><div class="detail-label">Source</div><div class="detail-value">${o.source?`<a class="source-link" href="${esc(o.source)}" target="_blank" rel="noopener">Open saved source ${icon('external')}</a>`:'No source saved'}</div></div><div class="detail-block full"><div class="detail-label">Linked applications</div><div class="detail-value">${apps.length?apps.map(a=>`<span class="pill ${a.status==='Already Sent'?'cyan':'green'}">${esc(a.status)} · ${esc(a.sentDate)}</span>`).join(' '):'<span class="muted">No application linked.</span>'}</div></div></div>`,`<button class="btn ghost" onclick="closeModal()">Close</button><button class="btn" onclick="closeModal();openImprove('${id}')">${icon('wand')} Improve Application</button><button class="btn primary" onclick="closeModal();openEmail('${id}')">${icon('mail')} Open email</button>`,true)}

      opportunities: [],
      applications: [],
      route: 'settings',
      connected: false,
      connectedEmail: null,
      emailProvider: '',
      selected: [],
      emailDrafts: {}
    });
  }

  function loadSignedOutState() {
    window.AIH_setDemoState();
  }

  function loadBrowserFallback() {
    try {
      var saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && Array.isArray(saved.opportunities) && Array.isArray(saved.applications)) {
        state = normalizeCloudState(saved);
      }
    } catch (error) {}
  }

  async function loadCloudState() {
    if (!client) {
      loadSignedOutState();
      render();
      return;
    }
    try {
      var sessionResult = await client.auth.getSession();
      cloudUser = sessionResult.data && sessionResult.data.session ? sessionResult.data.session.user : null;
      if (!cloudUser || !window.AIH_isOwnerSession(cloudUser)) {
        window.__AIH_OWNER_SESSION = null;
        cloudUser = null;
        cloudReady = false;
        loadSignedOutState();
        render();
        if (!localJsonHost) setTimeout(function(){ toast('Demo mode is active. Sign in with the owner account for private data and Settings.'); }, 0);
        return;
      }
      window.__AIH_OWNER_SESSION = cloudUser;
      window.__AIH_DEMO_PREVIEW = false;
      var result = await client.from('dashboard_state').select('payload').eq('user_id', cloudUser.id).maybeSingle();
      if (result.error) throw result.error;
      if (result.data && result.data.payload) {
        state = normalizeCloudState(result.data.payload);
      } else {
        state = normalizeCloudState(state);
        var firstSave = await client.from('dashboard_state').upsert({
          user_id: cloudUser.id,
          payload: state,
          updated_at: new Date().toISOString()
        });
        if (firstSave.error) throw firstSave.error;
      }
      cloudReady = true;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
      toast('Supabase cloud storage connected.');
    } catch (error) {
      cloudReady = false;
      console.error('Supabase connection error', error);
      if (!localJsonHost) {
        loadBrowserFallback();
        render();
      }
      toast('Supabase is connected, but the dashboard table or permissions are not ready yet.', true);
    }
  }

  async function cloudPersist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    if (window.__AIH_SKIP_CLOUD_SYNC || window.__AIH_DEMO_PREVIEW) return;
    if (localJsonHost && typeof __jsonFileReady !== 'undefined' && __jsonFileReady) {
      fetch('/api/state', {
        method: 'PUT',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(Object.assign({}, state, {storage: 'json-file'}))
      }).catch(function(){ toast('Could not save to dashboard-data.json.', true); });
    }
    if (!client || !cloudUser || !cloudReady || !window.AIH_isOwnerSession()) return;
    var result = await client.from('dashboard_state').upsert({
      user_id: cloudUser.id,
      payload: state,
      updated_at: new Date().toISOString()
    });
    if (result.error) toast('Cloud save failed. Your local copy is still available.', true);
  }

  function openCloudAuth() {
    if (!client) {
      toast('Supabase configuration is missing.', true);
      return;
    }
    var currentEmail = cloudUser && cloudUser.email ? cloudUser.email : '';
    modal(
      'Connect cloud database',
      'Sign in with a magic link so your dashboard data is private to your Supabase account.',
      '<div class="form-grid"><div class="field full"><label for="cloud-login-email">Account email</label><input id="cloud-login-email" type="email" value="' + esc(currentEmail) + '" placeholder="you@example.com" autocomplete="email"/></div></div><div class="helper-note">Supabase will email you a secure sign-in link. This is separate from the sender email used for application drafts.</div>',
      '<button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="requestCloudMagicLink()">Send sign-in link</button>',
      false
    );
  }

  async function requestCloudMagicLink() {
    var input = document.getElementById('cloud-login-email');
    var email = input && input.value ? input.value.trim() : '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      toast('Enter a valid account email address.', true);
      return;
    }
    var result = await client.auth.signInWithOtp({
      email: email,
      options: {emailRedirectTo: window.location.href, shouldCreateUser: false}
    });
    if (result.error) {
      var errorMessage = result.error.message || 'Could not send the sign-in link.';
      if (String(result.error.message || '').toLowerCase().indexOf('signups not allowed') !== -1) {
        errorMessage = 'This Supabase account exists but is not confirmed yet. Temporarily enable “Allow new users to sign up” in Supabase Auth, request the link again, confirm the email, then turn that setting off again.';
      }
      toast(errorMessage, true);
      return;
    }
    closeModal();
    toast('Sign-in link sent. Check your email and return to this dashboard.');
  }

  async function signOutCloud() {
    confirmModal(
      'Disconnect cloud database?',
      'The dashboard will stop syncing with Supabase. Your cloud records will remain stored.',
      'Disconnect',
      async function() {
        await client.auth.signOut();
        cloudUser = null;
        cloudReady = false;
        window.__AIH_OWNER_SESSION = null;
        loadSignedOutState();
        render();
        toast('Cloud database disconnected.');
      }
    );
  }

  function installCloudControl() {
    if (state.route !== 'settings' || document.getElementById('cloud-db-control')) return;
    var cards = Array.prototype.slice.call(document.querySelectorAll('.setting-card'));
    var card = cards.find(function(item) {
      var heading = item.querySelector('h2');
      return heading && heading.textContent.indexOf('Data Management') !== -1;
    });
    if (!card) return;
    var row = document.createElement('div');
    row.id = 'cloud-db-control';
    row.className = 'setting-row';
    var status = cloudReady && cloudUser
      ? 'Connected privately as ' + (cloudUser.email || 'your Supabase account') + '. Changes sync to Supabase.'
      : hasConfig
        ? 'Not signed in. Sign in to sync this dashboard between devices.'
        : 'Supabase configuration is missing.';
    var button = cloudReady && cloudUser
      ? '<button class="btn small ghost" onclick="disconnectCloudDatabase()">Disconnect</button>'
      : '<button class="btn small primary" onclick="openCloudDatabaseLogin()">Connect cloud database</button>';
    row.innerHTML = '<div><div class="setting-name">Supabase cloud storage</div><div class="setting-help">' + esc(status) + '</div></div>' + button;
    card.appendChild(row);
  }

  window.openCloudDatabaseLogin = openCloudAuth;
  window.requestCloudMagicLink = requestCloudMagicLink;
  window.disconnectCloudDatabase = signOutCloud;
  persist = cloudPersist;
  var previousRender = render;
  render = function() {
    previousRender();
    installCloudControl();
  };
  if (client) {
    client.auth.onAuthStateChange(function() {
      setTimeout(loadCloudState, 0);
    });
  }
  setTimeout(loadCloudState, 0);
})();
</script>
<script src="./opportunity-records-bridge.js"></script>
<script src="./phase2-ui.js"></script>
</body></html>
