name: Deploy AI Internship Hunter

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          node --check dist/opportunity-records-bridge.js
          node --check dist/phase2-ui.js
      - name: Run contract and UI tests
        run: node --test tests/*.test.mjs
      - name: Scan published assets for privileged credentials
        shell: bash
        run: |
          if git grep -n -E 'service_role_key|supabase_secret_key|ingest_api_key|oauth[_-]?token' -- dist; then
            echo "Privileged credential marker found in published assets."
            exit 1
          fi
  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the dashboard
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload dashboard files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

