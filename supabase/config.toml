# Keep production Edge Function authentication configuration in source control.
[functions.ingest-opportunities]
verify_jwt = true

[functions.sync-profile]
verify_jwt = true

# The OAuth callback is redirected from Google without a Supabase JWT. The
# function validates Supabase JWTs itself for user actions and consumes a
# single-use hashed state for the callback.
[functions.provider-oauth]
verify_jwt = false

# The Application Monitor uses the platform JWT boundary and performs a
# second signed-in-user check before reading owner-scoped application data.
[functions.application-monitor]
verify_jwt = true
